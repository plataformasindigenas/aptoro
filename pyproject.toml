[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aptoro"
version = "0.5.0"
description = "A minimal, functional Python ETL library for reading, validating, and transforming data using YAML schemas"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [
    { name = "Plataformas Indígenas" },
]
keywords = ["etl", "data", "validation", "schema", "yaml", "pydantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
sheets = ["gspread>=5.0", "google-auth>=2.0"]
sql = ["sqlalchemy>=2.0"]
excel = ["openpyxl>=3.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "types-PyYAML",
    "build",
    "twine",
]

[project.scripts]
aptoro = "aptoro.cli:main"

[project.urls]
Homepage = "https://github.com/plataformasindigenas/aptoro"
Documentation = "https://github.com/plataformasindigenas/aptoro#readme"
Repository = "https://github.com/plataformasindigenas/aptoro"

[tool.hatch.build.targets.wheel]
packages = ["src/aptoro"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
